services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  anti-bruteforce-test:
    build:
      context: ..
      dockerfile: deployments/api.Dockerfile
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres-test
      - REDIS_ADDR=redis-test:6379
    command: ["./anti-bruteforce", "-config", "configs/config.integration.yaml"]
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 5

  integration-tests:
    build:
      context: ..
      dockerfile: deployments/integration.Dockerfile
    env_file:
      - .env
    environment:
      - ANTI_BRUTEFORCE_GRPC_HOST=anti-bruteforce-test
      - ANTI_BRUTEFORCE_GRPC_PORT=50051
    depends_on:
      anti-bruteforce-test:
        condition: service_healthy
