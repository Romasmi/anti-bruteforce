syntax = "proto3";

package event;

import "google/api/annotations.proto";

option go_package = "github.com/Romasmi/anti-bruteforce/pkg/api;api";

message HelloRequest {}

message HelloResponse {
    string message = 1;
}

message HealthcheckRequest {}

message HealthcheckResponse {
    string status = 1;
}

message CheckAuthRequest {
    string login = 1;
    string password = 2;
    string ip = 3;
}

message CheckAuthResponse {
    bool ok = 1;
}

message ClearRateRequest {
    string login = 1;
    string ip = 2;
}

message ClearRateResponse {}

message IPListRequest {
    string subnet = 1;
}

message IPListResponse {}

service AntiBruteforce {
    rpc Hello(HelloRequest) returns (HelloResponse) {
        option (google.api.http) = {
            get: "/hello-world"
        };
    }

    rpc Healthcheck(HealthcheckRequest) returns (HealthcheckResponse) {
        option (google.api.http) = {
            get: "/healthcheck"
        };
    }

    rpc CheckAuth(CheckAuthRequest) returns (CheckAuthResponse) {
        option (google.api.http) = {
            post: "/auth/check"
            body: "*"
        };
    }

    rpc ClearRate(ClearRateRequest) returns (ClearRateResponse) {
        option (google.api.http) = {
            post: "/clear-rate"
            body: "*"
        };
    }

    rpc AddToBlacklist(IPListRequest) returns (IPListResponse) {
        option (google.api.http) = {
            post: "/blacklist"
            body: "*"
        };
    }

    rpc RemoveFromBlacklist(IPListRequest) returns (IPListResponse) {
        option (google.api.http) = {
            delete: "/blacklist"
            body: "*"
        };
    }

    rpc AddToWhitelist(IPListRequest) returns (IPListResponse) {
        option (google.api.http) = {
            post: "/whitelist"
            body: "*"
        };
    }

    rpc RemoveFromWhitelist(IPListRequest) returns (IPListResponse) {
        option (google.api.http) = {
            delete: "/whitelist"
            body: "*"
        };
    }
}
